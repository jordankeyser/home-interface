<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home Interface startup error</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: #06080d;
        color: #f3f6fa;
        font: 20px/1.5 system-ui, sans-serif;
      }
      main { max-width: 760px; padding: 48px; text-align: center; }
      h1 { color: #f87171; font-size: 32px; }
      p { color: #a8b3c5; }
      code {
        display: block;
        margin-top: 24px;
        padding: 16px;
        border: 1px solid #ffffff1f;
        border-radius: 12px;
        background: #ffffff0d;
        color: #35b6ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Home Interface could not start</h1>
      <p>The graphical session is working, but the local Vite server did not become available.</p>
      <code>tail -80 ~/.local/state/home-interface/vite.log</code>
      <p>Launcher details are in <strong>~/.local/state/home-interface/kiosk.log</strong>.</p>
    </main>
  </body>
</html>
